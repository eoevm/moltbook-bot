<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moltbook Auto Register 🦞</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo .emoji {
      font-size: 56px;
      display: block;
      margin-bottom: 10px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .logo h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(90deg, #f093fb, #f5576c, #fda085);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo p {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, textarea {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      transition: all 0.3s ease;
      outline: none;
      font-family: inherit;
    }

    input::placeholder, textarea::placeholder {
      color: rgba(255,255,255,0.3);
    }

    input:focus, textarea:focus {
      border-color: #f093fb;
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 0 3px rgba(240, 147, 251, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(240, 147, 251, 0.4);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn.loading .btn-text { display: none; }
    .btn.loading .spinner { display: block; }

    /* Result Card */
    .result-card {
      display: none;
      margin-top: 30px;
      background: rgba(0, 255, 150, 0.05);
      border: 1px solid rgba(0, 255, 150, 0.2);
      border-radius: 16px;
      padding: 24px;
      animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-card.error {
      background: rgba(255, 80, 80, 0.05);
      border-color: rgba(255, 80, 80, 0.3);
    }

    .result-card h3 {
      font-size: 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-card.success h3 { color: #00ff96; }
    .result-card.error h3 { color: #ff5050; }

    .field-row {
      margin-bottom: 14px;
    }

    .field-row .field-label {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 5px;
    }

    .field-value-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .field-value {
      flex: 1;
      font-size: 13px;
      color: #e0e0e0;
      word-break: break-all;
      font-family: 'Courier New', monospace;
    }

    .copy-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 6px;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      padding: 5px 10px;
      font-size: 12px;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .copy-btn:hover {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    .copy-btn.copied {
      background: rgba(0, 255, 150, 0.2);
      color: #00ff96;
    }

    .claim-link {
      color: #f093fb;
      text-decoration: none;
      font-size: 13px;
      word-break: break-all;
    }

    .claim-link:hover {
      text-decoration: underline;
    }

    .warning-box {
      background: rgba(255, 200, 0, 0.08);
      border: 1px solid rgba(255, 200, 0, 0.25);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #ffd700;
      margin-top: 16px;
      line-height: 1.5;
    }

    .warning-box strong {
      display: block;
      margin-bottom: 4px;
    }

    .save-btn {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: rgba(0, 255, 150, 0.1);
      border: 1px solid rgba(0, 255, 150, 0.3);
      border-radius: 10px;
      color: #00ff96;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .save-btn:hover {
      background: rgba(0, 255, 150, 0.2);
    }

    .error-msg {
      font-size: 14px;
      color: #ff8080;
      line-height: 1.5;
    }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 24px 0;
    }

    .info-note {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      text-align: center;
      line-height: 1.6;
    }

    .info-note a {
      color: rgba(240, 147, 251, 0.7);
      text-decoration: none;
    }

    .info-note a:hover {
      color: #f093fb;
    }

    /* Multi-register section */
    .multi-section {
      margin-top: 30px;
    }

    .multi-section h2 {
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .multi-section h2::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    .multi-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .multi-controls input {
      flex: 1;
    }

    .btn-secondary {
      padding: 14px 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255,255,255,0.15);
    }

    .btn-secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .multi-results {
      max-height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .multi-results::-webkit-scrollbar {
      width: 4px;
    }

    .multi-results::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
    }

    .multi-results::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
    }

    .multi-item {
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .multi-item.success { border-color: rgba(0,255,150,0.2); }
    .multi-item.error { border-color: rgba(255,80,80,0.2); }
    .multi-item.pending { border-color: rgba(255,200,0,0.2); }

    .multi-item .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .multi-item.success .status-dot { background: #00ff96; }
    .multi-item.error .status-dot { background: #ff5050; }
    .multi-item.pending .status-dot {
      background: #ffd700;
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .multi-item .item-info {
      flex: 1;
      min-width: 0;
    }

    .multi-item .item-name {
      font-weight: 600;
      color: #e0e0e0;
      margin-bottom: 2px;
    }

    .multi-item .item-key {
      color: rgba(255,255,255,0.4);
      font-family: monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .export-all-btn {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      background: rgba(240, 147, 251, 0.1);
      border: 1px solid rgba(240, 147, 251, 0.3);
      border-radius: 10px;
      color: #f093fb;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: none;
    }

    .export-all-btn:hover {
      background: rgba(240, 147, 251, 0.2);
    }

    .progress-bar-wrap {
      background: rgba(255,255,255,0.08);
      border-radius: 6px;
      height: 6px;
      margin-bottom: 14px;
      overflow: hidden;
      display: none;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #f093fb, #f5576c);
      border-radius: 6px;
      transition: width 0.3s ease;
      width: 0%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span class="emoji">🦞</span>
      <h1>Moltbook Register</h1>
      <p>Auto-register your AI agent on Moltbook</p>
    </div>

    <!-- Single Register -->
    <div class="form-group">
      <label>Agent Name</label>
      <input type="text" id="agentName" placeholder="e.g. MyAwesomeBot" maxlength="50" />
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea id="agentDesc" placeholder="What does your agent do? e.g. I help with coding questions and debugging."></textarea>
    </div>

    <button class="btn" id="registerBtn" onclick="registerSingle()">
      <span class="btn-text">🦞 Register Agent</span>
      <div class="spinner"></div>
    </button>

    <!-- Result Card -->
    <div class="result-card" id="resultCard">
      <h3 id="resultTitle"></h3>
      <div id="resultContent"></div>
    </div>

    <div class="divider"></div>

    <!-- Multi Register -->
    <div class="multi-section">
      <h2>⚡ Bulk Register</h2>

      <div class="multi-controls">
        <input type="number" id="multiCount" placeholder="Count (e.g. 5)" min="1" max="20" value="3" />
        <input type="text" id="multiPrefix" placeholder="Prefix (e.g. Bot)" style="flex:2" />
        <button class="btn-secondary" id="multiBtnStart" onclick="registerMulti()">Start</button>
        <button class="btn-secondary" id="multiBtnStop" onclick="stopMulti()" style="display:none; border-color:rgba(255,80,80,0.3); color:#ff8080;">Stop</button>
      </div>

      <div class="progress-bar-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="multi-results" id="multiResults"></div>
      <button class="export-all-btn" id="exportAllBtn" onclick="exportAll()">📥 Export All Credentials (JSON)</button>
    </div>

    <div class="divider"></div>

    <p class="info-note">
      After registering, send the <strong>claim_url</strong> to your human.<br/>
      They verify via email + tweet to activate your agent.<br/>
      <a href="https://www.moltbook.com" target="_blank">moltbook.com</a> · 
      <a href="https://www.moltbook.com/skill.md" target="_blank">API Docs</a>
    </p>
  </div>

  <script>
    const API_BASE = 'https://www.moltbook.com/api/v1';
    let multiStop = false;
    let multiCredentials = [];

    // ─── Single Register ───────────────────────────────────────────────────────

    async function registerSingle() {
      const name = document.getElementById('agentName').value.trim();
      const description = document.getElementById('agentDesc').value.trim();

      if (!name) {
        showError('Please enter an agent name.');
        return;
      }
      if (!description) {
        showError('Please enter a description.');
        return;
      }

      const btn = document.getElementById('registerBtn');
      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/agents/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, description })
        });

        const data = await res.json();

        if (res.ok && data.agent) {
          showSuccess(data.agent, name);
        } else {
          showError(data.error || data.message || 'Registration failed. Please try again.');
        }
      } catch (err) {
        showError('Network error: ' + err.message + '. Make sure you have internet access.');
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    }

    function showSuccess(agent, name) {
      const card = document.getElementById('resultCard');
      const title = document.getElementById('resultTitle');
      const content = document.getElementById('resultContent');

      card.className = 'result-card success';
      card.style.display = 'block';
      title.textContent = '✅ Registration Successful!';

      content.innerHTML = `
        ${fieldRow('Agent Name', name)}
        ${fieldRow('API Key', agent.api_key, true)}
        ${fieldRow('Verification Code', agent.verification_code)}
        <div class="field-row">
          <div class="field-label">Claim URL</div>
          <div class="field-value-wrap">
            <a href="${agent.claim_url}" target="_blank" class="claim-link field-value">${agent.claim_url}</a>
            <button class="copy-btn" onclick="copyText('${agent.claim_url}', this)">Copy</button>
          </div>
        </div>
        <div class="warning-box">
          <strong>⚠️ Save your API Key now!</strong>
          Your API key is shown only once. Copy it and store it safely.
        </div>
        <button class="save-btn" onclick="downloadCredentials('${name}', '${agent.api_key}', '${agent.claim_url}', '${agent.verification_code}')">
          📥 Download Credentials (JSON)
        </button>
      `;

      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function showError(msg) {
      const card = document.getElementById('resultCard');
      const title = document.getElementById('resultTitle');
      const content = document.getElementById('resultContent');

      card.className = 'result-card error';
      card.style.display = 'block';
      title.textContent = '❌ Registration Failed';
      content.innerHTML = `<p class="error-msg">${escapeHtml(msg)}</p>`;
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function fieldRow(label, value, isKey = false) {
      const display = isKey ? value : value;
      return `
        <div class="field-row">
          <div class="field-label">${label}</div>
          <div class="field-value-wrap">
            <span class="field-value">${escapeHtml(display)}</span>
            <button class="copy-btn" onclick="copyText('${escapeAttr(value)}', this)">Copy</button>
          </div>
        </div>
      `;
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = '✓ Copied';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = orig;
          btn.classList.remove('copied');
        }, 2000);
      }).catch(() => {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        btn.textContent = '✓ Copied';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    function downloadCredentials(name, apiKey, claimUrl, verificationCode) {
      const data = {
        agent_name: name,
        api_key: apiKey,
        claim_url: claimUrl,
        verification_code: verificationCode,
        registered_at: new Date().toISOString(),
        note: 'Keep this file safe! Your API key is your identity on Moltbook.'
      };
      downloadJSON(data, `moltbook_${name}_credentials.json`);
    }

    function downloadJSON(data, filename) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ─── Multi Register ────────────────────────────────────────────────────────

    async function registerMulti() {
      const count = parseInt(document.getElementById('multiCount').value) || 3;
      const prefix = document.getElementById('multiPrefix').value.trim() || 'MoltAgent';

      if (count < 1 || count > 20) {
        alert('Count must be between 1 and 20.');
        return;
      }

      multiStop = false;
      multiCredentials = [];

      const resultsEl = document.getElementById('multiResults');
      const progressWrap = document.getElementById('progressWrap');
      const progressBar = document.getElementById('progressBar');
      const exportBtn = document.getElementById('exportAllBtn');
      const startBtn = document.getElementById('multiBtnStart');
      const stopBtn = document.getElementById('multiBtnStop');

      resultsEl.innerHTML = '';
      progressWrap.style.display = 'block';
      progressBar.style.width = '0%';
      exportBtn.style.display = 'none';
      startBtn.disabled = true;
      stopBtn.style.display = 'inline-block';

      for (let i = 1; i <= count; i++) {
        if (multiStop) break;

        const agentName = `${prefix}${i}_${randomSuffix()}`;
        const description = `AI agent ${agentName} — registered via Moltbook Auto Register`;

        // Add pending item
        const itemId = `multi-item-${i}`;
        resultsEl.insertAdjacentHTML('beforeend', `
          <div class="multi-item pending" id="${itemId}">
            <div class="status-dot"></div>
            <div class="item-info">
              <div class="item-name">${escapeHtml(agentName)}</div>
              <div class="item-key">Registering...</div>
            </div>
          </div>
        `);

        resultsEl.scrollTop = resultsEl.scrollHeight;

        try {
          const res = await fetch(`${API_BASE}/agents/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: agentName, description })
          });

          const data = await res.json();
          const item = document.getElementById(itemId);

          if (res.ok && data.agent) {
            multiCredentials.push({
              agent_name: agentName,
              api_key: data.agent.api_key,
              claim_url: data.agent.claim_url,
              verification_code: data.agent.verification_code,
              registered_at: new Date().toISOString()
            });

            item.className = 'multi-item success';
            item.innerHTML = `
              <div class="status-dot"></div>
              <div class="item-info">
                <div class="item-name">✅ ${escapeHtml(agentName)}</div>
                <div class="item-key">${escapeHtml(data.agent.api_key)}</div>
              </div>
              <button class="copy-btn" onclick="copyText('${escapeAttr(data.agent.api_key)}', this)" style="font-size:11px">Copy Key</button>
            `;
          } else {
            item.className = 'multi-item error';
            item.innerHTML = `
              <div class="status-dot"></div>
              <div class="item-info">
                <div class="item-name">❌ ${escapeHtml(agentName)}</div>
                <div class="item-key">${escapeHtml(data.error || data.message || 'Failed')}</div>
              </div>
            `;
          }
        } catch (err) {
          const item = document.getElementById(itemId);
          item.className = 'multi-item error';
          item.innerHTML = `
            <div class="status-dot"></div>
            <div class="item-info">
              <div class="item-name">❌ ${escapeHtml(agentName)}</div>
              <div class="item-key">Network error: ${escapeHtml(err.message)}</div>
            </div>
          `;
        }

        progressBar.style.width = `${(i / count) * 100}%`;

        // Delay between requests to respect rate limits
        if (i < count && !multiStop) {
          await sleep(1200);
        }
      }

      startBtn.disabled = false;
      stopBtn.style.display = 'none';

      if (multiCredentials.length > 0) {
        exportBtn.style.display = 'block';
      }
    }

    function stopMulti() {
      multiStop = true;
      document.getElementById('multiBtnStop').style.display = 'none';
      document.getElementById('multiBtnStart').disabled = false;
    }

    function exportAll() {
      if (multiCredentials.length === 0) return;
      downloadJSON({
        exported_at: new Date().toISOString(),
        total: multiCredentials.length,
        agents: multiCredentials
      }, `moltbook_bulk_credentials_${Date.now()}.json`);
    }

    // ─── Helpers ───────────────────────────────────────────────────────────────

    function randomSuffix() {
      return Math.random().toString(36).substring(2, 6).toUpperCase();
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // Allow Enter key to submit single register
    document.getElementById('agentName').addEventListener('keydown', e => {
      if (e.key === 'Enter') registerSingle();
    });
  </script>
